</style></head><body>
<div id="pending" class="pending-bar" hidden></div>
<header class="topbar"><div><div class="brand">MOTISONS</div><div class="brand-sub">ORDER & REPAIR TRACKER</div></div><div class="top-actions"><span id="pageBadge" class="source-chip"></span><button id="logoutTop" class="top-button signout" data-action="logout" hidden>Sign out</button></div></header>
<div id="demoBanner" class="demo-banner" hidden>Preview</div>
<main id="app" class="main"></main><div id="modalRoot"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const SERVER_BOOT=/*SERVER_BOOT*/null;
const PAGE=SERVER_BOOT?.page||'admin';
const APPS_RUNTIME=!!(typeof google!=='undefined'&&google.script&&google.script.run);
const API_URL='https://script.google.com/macros/s/AKfycbwBg_yqa_lsbU6nWaADrLCORkT37fd5k7XsWm7WGEagppSdWKvZzy3QPpLEDcGsXPLk/exec';
const PREVIEW=!APPS_RUNTIME&&(location.protocol==='file:'||new URLSearchParams(location.search).get('preview')==='1');
const LIVE=!PREVIEW;
const GITHUB_BUILD=true;
const FLOW={order:['booked','preparing','qc','ready','delivered'],repair:['booked','repairing','qc','ready','delivered']};
const LABELS={booked:'Booked',preparing:'Preparing',repairing:'Repairing',qc:'QC Check',ready:'Ready for Pickup',delivered:'Delivered'};
const PATHS={box:'M21 8l-9 5-9-5m9 5v9M3 8l9-5 9 5v10l-9 5-9-5V8z',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',user:'M20 21v-2a7 7 0 0 0-14 0v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',check:'M5 12l4 4L20 5',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',calendar:'M8 2v4m8-4v4M3 10h18M4 4h16v18H4z',tool:'M14 6a5 5 0 0 0-6 6L2 18l4 4 6-6a5 5 0 0 0 6-6l-4 4-4-4 4-4z',diamond:'M3 8l4-5h10l4 5-9 14L3 8zm0 0h18M7 3l5 19 5-19',refresh:'M20 7a9 9 0 1 0 1 9M20 2v6h-6',logout:'M9 4H3v16h6m6-15 6 7-6 7M8 12h13',close:'M6 6l12 12M6 18 18 6',arrow:'M5 12h14m-6-6 6 6-6 6',shield:'M12 2l9 4v6c0 6-9 10-9 10S3 18 3 12V6l9-4zm-5 10 3 3 7-7',info:'M12 11v6m0-10h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',image:'M3 3h18v18H3zM3 17l6-7 4 4 3-3 5 6M15 7h.01'};
const S={user:null,token:'',people:[],groups:[],customerResult:null,credentials:null,today:localDay(),fetchedAt:'',pending:false,error:'',search:'',type:'all',bucket:'all',branch:'all',segment:'all',salesperson:'all',rawStatus:'all',page:1,pageSize:10,detail:null,links:{},auto:true};
const PHOTO_CACHE=new Map();let photoEpoch=0;
function icon(name){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(PATHS[name]||PATHS.box)+'"/></svg>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmt(v){if(!v)return 'Not provided';const d=new Date(v.slice(0,10)+'T00:00:00');return isNaN(d)?v:new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(d);}
function stamp(v){if(!v)return '';return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',second:'2-digit',timeZone:'Asia/Kolkata'}).format(new Date(v));}
function pill(label,tone='gold'){return '<span class="pill '+tone+'">'+esc(label)+'</span>';}
function initials(n){return String(n||'M').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function delivery(g){if(g.status==='delivered')return {label:'Delivered',tone:'grey'};if(g.status==='ready')return {label:'Ready for Pickup',tone:'green'};if(g.due&&g.due<S.today)return {label:'Overdue',tone:'red'};if(g.due===S.today)return {label:'Due Today',tone:'gold'};if(!g.due)return {label:'Date Missing',tone:'gold'};return {label:'On Track',tone:'green'};}
function overdue(g){return !['ready','delivered'].includes(g.status)&&g.due&&g.due<S.today;}
function busy(on){S.pending=on;document.getElementById('pending').hidden=!on;document.querySelectorAll('button[type="submit"]').forEach(b=>b.disabled=on);}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3800);}
function tokenKey(){return 'motisons-v3-'+PAGE;}
function saveSession(){try{sessionStorage.setItem(tokenKey(),S.token);}catch(e){}}
function clearSession(){S.token='';S.user=null;try{sessionStorage.removeItem(tokenKey());}catch(e){}}
function rpc(action,data={}){
 if(PREVIEW)return Promise.resolve().then(()=>demoApi(action,data));
 const payload={...data,action,token:S.token};
 const unwrap=r=>{if(r?.ok)return r.data;const m=r?.error||'Request failed.';if(m.includes('Session expired'))clearSession();throw new Error(m);};
 if(APPS_RUNTIME)return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>{try{resolve(unwrap(r));}catch(e){reject(e);}}).withFailureHandler(()=>reject(new Error('Connection failed.'))).trackerApi(payload);});
 return (async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{
   const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',credentials:'omit',signal:controller.signal});
   let result;try{result=JSON.parse(await response.text());}catch(e){throw new Error('Backend unavailable.');}
   return unwrap(result);
 }catch(e){if(e.name==='TypeError'||e.name==='AbortError')throw new Error('Connection failed.');throw e;}finally{clearTimeout(timer);}})();
}
function render(){document.getElementById('app').innerHTML=PAGE==='customer'?customerPage():!S.user?loginPage():workspace();document.getElementById('logoutTop').hidden=!S.user;loadPhotos();}
function customerPage(){return '<div class="customer-grid '+(S.customerResult?'':'search-only')+'"><section class="panel panel-pad track-search"><h1 class="section-title">Track Order / Repair</h1><form id="trackForm"><div class="field"><label for="orderNumber">Order / Repair Number</label><input id="orderNumber" name="order" placeholder="ORD-84 / REP-1261" maxlength="100" value="'+esc(S.credentials?.order||'')+'" required autocomplete="off"></div><div class="field"><label for="customerMobile">Mobile Number</label><input id="customerMobile" type="tel" inputmode="tel" name="mobile" maxlength="16" placeholder="10-digit mobile number" value="'+esc(S.credentials?.mobile||'')+'" required autocomplete="tel"></div><button class="btn full" type="submit">'+icon('search')+' Check Status</button><div id="trackError" role="alert"></div></form></section><section class="customer-result-stack" id="customerResult">'+(S.customerResult?S.customerResult.groups.map(customerGroup).join(''):'')+'</section></div>';}
function customerGroup(g){const flow=FLOW[g.type]||[],idx=flow.indexOf(g.status);return '<article class="panel panel-pad"><div class="job-number">'+esc(g.reference)+' '+pill(g.type==='repair'?'Repair':g.type==='order'?'Order':'Item',g.type==='repair'?'blue':'gold')+'</div><h2 class="product-title">'+esc(g.customer)+'</h2><div class="subtle">'+esc(g.itemCount)+' item'+(g.itemCount===1?'':'s')+' · '+esc(g.segment||'Jewellery')+'</div><div class="customer-meta"><div><div class="meta-label">Promised delivery</div><div class="meta-value">'+icon('calendar')+' '+esc(fmt(g.due))+'</div></div><div><div class="meta-label">Pickup branch</div><div class="meta-value">'+esc(g.branch||'Check receipt')+'</div></div><div><div class="meta-label">Booking date</div><div class="meta-value">'+esc(fmt(g.booked))+'</div></div></div><div class="current-box">'+icon(g.status==='delivered'?'check':g.type==='repair'?'tool':'diamond')+'<div><span class="subtle">Overall Progress</span><strong>'+esc(g.statusLabel)+'</strong></div></div>'+(flow.length&&idx>=0?'<div class="timeline">'+flow.map((step,i)=>'<div class="step '+(i<idx||g.status==='delivered'?'done':i===idx?'current':'')+'"><div class="step-marker">'+(i<idx||g.status==='delivered'?icon('check'):'')+'</div><div class="step-text"><div class="step-name">'+LABELS[step]+'</div><div class="step-info">'+(i<idx||g.status==='delivered'?'Completed':i===idx?'Current step':'Pending')+'</div></div></div>').join('')+'</div>':'<div class="notice">Update Pending</div>')+(overdue(g)?'<div style="margin:12px 0">'+pill('Overdue','red')+'</div>':'')+'<div class="group-summary"><strong>Your Items</strong><span>Ready / delivered: '+g.readyCount+' of '+g.itemCount+'</span></div>'+g.items.map(j=>'<section class="item-detail">'+photoBox(j.photoGrant,j.product)+'<div class="item-head"><div><h3>'+esc(j.product)+'</h3><div class="subtle">Quantity: '+esc(j.qty||'Not provided')+'</div></div>'+pill(j.statusLabel,j.status==='ready'||j.status==='delivered'?'green':'gold')+'</div><div class="progress-meta">Promised delivery: '+esc(fmt(j.due))+'</div>'+itemTimeline(j,g.type)+'</section>').join('')+'<button class="btn secondary full" data-action="refreshCustomer" style="margin-top:20px">'+icon('refresh')+' Refresh Status</button><div class="fetch-caption">Checked: '+esc(stamp(S.fetchedAt))+' IST</div></article>';}
function itemTimeline(j,type){const f=FLOW[type]||[],idx=f.indexOf(j.status);if(idx<0)return '';return '<div class="item-timeline">'+f.map((s,i)=>'<div class="item-stage '+(i<idx||j.status==='delivered'?'done':i===idx?'current':'')+'">'+LABELS[s]+'</div>').join('')+'</div>';}
function photoBox(grant,product){return '<div class="photo-box" '+(grant?'data-photo="'+esc(grant)+'"':'')+' data-product="'+esc(product||'Product')+'"><div class="photo-placeholder">'+icon('image')+(grant?'Loading…':'No photo')+'</div></div>';}
function loginPage(){const title=PAGE==='admin'?'Admin':'Salesperson';return '<section class="login-layout"><div class="panel panel-pad"><h1 class="section-title">'+title+' Login</h1><form id="loginForm">'+(PAGE==='admin'?'<div class="field"><label for="username">Username</label><input id="username" name="username" placeholder="admin" autocomplete="username" maxlength="80" required></div>':'<div class="field"><label for="salespersonName">Salesperson</label><select id="salespersonName" name="personId" required><option value="">Select name</option>'+S.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' · '+esc(p.branch)+'</option>').join('')+'</select></div>')+'<button class="btn full" type="submit">Login</button><div id="loginError" role="alert">'+(S.error?'<div class="error">'+esc(S.error)+'</div>':'')+'</div></form></div></section>';}
function workspace(){const u=S.user;return '<div class="workspace panel"><aside class="sidebar"><button class="nav-btn active" data-action="allJobs">'+icon('box')+(PAGE==='admin'?'All Orders & Repairs':'My Orders & Repairs')+'</button>'+(PAGE==='admin'?'<button class="nav-btn" data-action="issues">'+icon('info')+' Data Issues ('+S.groups.filter(g=>g.issues.length).length+')</button>':'')+'</aside><section class="workspace-main"><div class="workspace-heading"><div><div class="subtle">'+esc(u.branch||'All branches')+' · '+esc(fmt(S.today))+'</div><h1>'+(PAGE==='admin'?'All Orders & Repairs':'My Orders & Repairs')+'</h1></div><div class="user-chip"><span class="avatar">'+esc(initials(u.name))+'</span><div class="user-name"><strong>'+esc(u.name)+'</strong>'+esc(PAGE==='admin'?'Administrator':'Salesperson')+'</div></div></div>'+(S.error?'<div class="error" role="alert">'+esc(S.error)+'</div>':'')+'<div class="stats">'+[['active','Active','box',S.groups.filter(g=>g.status!=='delivered').length],['due','Due Today','calendar',S.groups.filter(g=>g.status!=='delivered'&&g.due===S.today).length],['overdue','Overdue','clock',S.groups.filter(overdue).length],['ready','Ready','check',S.groups.filter(g=>g.status==='ready').length]].map(([key,label,ico,n])=>'<button class="stat '+key+' '+(S.bucket===key?'active':'')+'" data-action="bucket" data-bucket="'+key+'"><div class="stat-label">'+icon(ico)+label+'</div><div class="stat-number">'+n+'</div></button>').join('')+'</div><div class="summary-bar">'+S.groups.length+' bookings · '+S.groups.reduce((n,g)=>n+g.itemCount,0)+' items</div><div class="toolbar"><div class="tabs">'+[['all','All'],['order','Orders'],['repair','Repairs']].map(([v,l])=>'<button class="filter-tab '+(S.type===v?'active':'')+'" data-action="type" data-type="'+v+'">'+l+'</button>').join('')+'</div><div class="search-wrap">'+icon('search')+'<input id="search" class="search-input" aria-label="Search bookings" placeholder="Search booking, customer, mobile…" value="'+esc(S.search)+'"></div><button class="btn secondary small" data-action="refresh">'+icon('refresh')+' Refresh</button></div><div class="filters-grid">'+selectFilter('bucket','Delivery status',[['all','All delivery statuses'],['active','Active'],['due','Due Today'],['overdue','Overdue'],['ready','Ready for Pickup'],['delivered','Delivered'],['issues','Data Issues']])+selectFilter('rawStatus','Status',[['all','All statuses'],...unique(S.groups.flatMap(g=>g.rawStatuses)).map(x=>[x,x||'(blank)'])])+selectFilter('segment','Segment',[['all','All segments'],...unique(S.groups.map(g=>g.segment)).map(x=>[x,x||'(blank)'])])+(PAGE==='admin'?selectFilter('branch','Branch',[['all','All branches'],...unique(S.groups.map(g=>g.branch)).map(x=>[x,x||'(blank)'])])+selectFilter('salesperson','Salesperson',[['all','All salespersons'],...unique(S.groups.flatMap(g=>g.salespersons)).map(x=>[x,x||'(blank)'])]):'')+'</div><div id="bookingList">'+bookingList()+'</div><div class="list-footer"><span>Checked: '+esc(stamp(S.fetchedAt))+' IST</span><label class="check-inline"><input id="autoRefresh" type="checkbox" '+(S.auto?'checked':'')+'> Auto-refresh</label></div>'+(PAGE==='admin'?'<div class="admin-links">'+Object.entries(S.links).map(([k,v])=>'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(k[0].toUpperCase()+k.slice(1))+' page</a>').join('')+'</div>':'')+'</section></div>';}
function unique(a){return [...new Set(a)].sort((a,b)=>a.localeCompare(b));}
function selectFilter(key,label,options){return '<select data-filter="'+key+'" aria-label="'+label+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'" '+(S[key]===v?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';}
function filtered(){return S.groups.filter(g=>(S.type==='all'||g.type===S.type)&&(S.branch==='all'||g.branch===S.branch)&&(S.segment==='all'||g.segment===S.segment)&&(S.salesperson==='all'||g.salespersons.includes(S.salesperson))&&(S.rawStatus==='all'||g.rawStatuses.includes(S.rawStatus))&&(S.bucket==='all'||S.bucket==='active'&&g.status!=='delivered'||S.bucket==='due'&&g.status!=='delivered'&&g.due===S.today||S.bucket==='overdue'&&overdue(g)||S.bucket==='ready'&&g.status==='ready'||S.bucket==='delivered'&&g.status==='delivered'||S.bucket==='issues'&&g.issues.length)&&(!S.search||[g.reference,g.customer,g.contact,...g.salespersons].join(' ').toLowerCase().includes(S.search.toLowerCase()))).sort((a,b)=>(a.status==='delivered')-(b.status==='delivered')||(a.due||'9999').localeCompare(b.due||'9999'));}
function actualStatuses(g){return '<div class="status-stack">'+g.rawStatuses.map(s=>'<span class="pill source-status">'+esc(s||'(blank)')+'</span>').join('')+'</div>';}
function bookingList(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/S.pageSize));S.page=Math.min(S.page,pages);const list=all.slice((S.page-1)*S.pageSize,S.page*S.pageSize);if(!list.length)return '<div class="empty">'+icon('box')+'<div>No matching bookings.</div></div>';return '<div class="table-wrap"><table><thead><tr><th>Booking</th><th>Customer</th><th>Status</th><th>Delivery Date</th><th>Details</th></tr></thead><tbody>'+list.map(g=>{const d=delivery(g);return '<tr><td><button class="job-link" data-action="detail" data-id="'+esc(g.id)+'">'+esc(g.reference)+'</button><div class="group-list-meta">'+esc(g.segment)+' · '+g.itemCount+' item'+(g.itemCount===1?'':'s')+'</div></td><td><strong>'+esc(g.customer)+'</strong><div class="group-list-meta">'+esc(g.branch)+' · '+esc(g.salespersons.join(', '))+'</div></td><td>'+actualStatuses(g)+'</td><td>'+esc(fmt(g.due))+'<div style="margin-top:6px">'+pill(d.label,d.tone)+'</div></td><td>'+(g.issues.length?'<div style="margin-bottom:7px">'+pill(g.issues.length+' data issue'+(g.issues.length===1?'':'s'),'gold')+'</div>':'')+'<button class="btn secondary small" data-action="detail" data-id="'+esc(g.id)+'">View Details</button></td></tr>';}).join('')+'</tbody></table></div><div class="mobile-jobs">'+list.map(g=>{const d=delivery(g);return '<article class="job-card"><div class="job-card-top"><button class="job-link" data-action="detail" data-id="'+esc(g.id)+'">'+esc(g.reference)+' '+icon('arrow')+'</button>'+pill(d.label,d.tone)+'</div><div class="job-card-info"><div><strong>'+esc(g.customer)+'</strong><div class="group-list-meta">'+esc(g.segment)+' · '+g.itemCount+' items · '+esc(g.branch)+'</div></div></div><div style="margin:12px 0">'+actualStatuses(g)+'</div><div class="job-card-bottom"><span>'+esc(g.salespersons.join(', '))+'</span><span>'+icon('calendar')+' '+esc(fmt(g.due))+'</span></div>'+(g.issues.length?'<div style="margin-top:8px">'+pill(g.issues.length+' data issues')+'</div>':'')+'</article>';}).join('')+'</div><div class="list-footer"><span>'+all.length+' bookings</span><div class="pagination"><button class="btn secondary small" data-action="prev" '+(S.page<=1?'disabled':'')+'>Previous</button><span>'+S.page+' / '+pages+'</span><button class="btn secondary small" data-action="next" '+(S.page>=pages?'disabled':'')+'>Next</button></div></div>';}
function modal(title,html){document.getElementById('modalRoot').innerHTML='<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle">'+esc(title)+'</h2><button class="close" data-action="closeModal" aria-label="Close">'+icon('close')+'</button></header><div class="modal-body">'+html+'</div></section></div>';document.body.style.overflow='hidden';document.querySelector('.modal .close')?.focus();loadPhotos();}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow='';}
async function openDetail(id){modal('Booking Details','<div class="loading"><span class="spinner"></span> Loading…</div>');try{const g=await rpc('detail',{id});S.detail=g;modal(g.reference+' · '+g.itemCount+' Items','<section class="panel panel-pad"><h3 class="product-title">'+esc(g.customer)+'</h3><div class="detail-grid">'+[['Mobile',g.contact],['Branch',g.branch],['Segment',g.segment],['Salesperson',g.salespersons.join(', ')],['Booking Date',fmt(g.booked)],['Delivery Date',fmt(g.due)]].map(([l,v])=>'<div><div class="meta-label">'+esc(l)+'</div><div class="meta-value">'+esc(v)+'</div></div>').join('')+'</div></section>'+g.items.map(j=>'<section class="panel panel-pad" style="margin-top:18px">'+photoBox(j.photoGrant,j.product)+'<div class="item-head"><h3 class="section-title">'+esc(j.product)+'</h3>'+pill(j.sourceType,j.type==='repair'?'blue':'gold')+'</div><div class="meta-label">Status</div><div class="status-stack">'+pill(j.rawStatus||'(blank)','wine')+'</div><div class="detail-grid" style="margin-top:18px">'+[['Unique Id',j.uid||'Missing'],['Quantity',j.qty||'Not provided'],['Delivery Date',fmt(j.due)],['Final Status',j.finalStatus||'(blank)']].map(([l,v])=>'<div><div class="meta-label">'+esc(l)+'</div><div class="meta-value">'+esc(v)+'</div></div>').join('')+'</div>'+(j.issues.length?'<div class="divider"></div><strong class="subtle">Data Issues</strong><ul class="data-issue-list">'+j.issues.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')+'</section>').join(''));}catch(e){modal('Booking Details','<div class="error">'+esc(e.message)+'</div>');}}
function loadPhotos(){const epoch=++photoEpoch;const nodes=[...document.querySelectorAll('[data-photo]')].filter(n=>!n.dataset.photoLoading);nodes.forEach(n=>n.dataset.photoLoading='true');let next=0;async function worker(){while(next<nodes.length){const box=nodes[next++];if(!box.isConnected)continue;const grant=box.dataset.photo;try{let src=PHOTO_CACHE.get(grant);if(!src){const result=await rpc('photo',{grant});src=result.src;if(!/^data:image\/(?:jpeg|png|webp|gif);base64,|^https:\/\//i.test(src)&&!(!LIVE&&src.startsWith('data:image/svg+xml;base64,')))throw new Error('Unsupported image response.');PHOTO_CACHE.set(grant,src);if(PHOTO_CACHE.size>100)PHOTO_CACHE.delete(PHOTO_CACHE.keys().next().value);}if(!box.isConnected)continue;const img=document.createElement('img');img.alt=box.dataset.product+' — product photo';img.referrerPolicy='no-referrer';img.loading='lazy';img.addEventListener('error',()=>photoError(box,'The image could not be displayed. Contact your branch to check the photo link.'));img.addEventListener('click',()=>modal(box.dataset.product,'<img class="lightbox" alt="'+esc(box.dataset.product)+'" src="'+esc(src)+'">'));img.src=src;box.replaceChildren(img);}catch(e){if(box.isConnected)photoError(box,e.message);}}}worker();worker();}
function photoError(box,message){box.innerHTML='<div class="photo-placeholder">'+icon('image')+'Photo unavailable</div>';}
async function loadStaff(){const d=await rpc('list');if(d.user.role!==PAGE){clearSession();throw new Error('Use the correct page for your account.');}S.user=d.user;S.groups=d.groups;S.today=d.today;S.fetchedAt=d.fetchedAt;S.links=GITHUB_BUILD?{customer:'./',salesperson:'salesperson.html',admin:'admin.html'}:d.links;S.error='';}
async function refreshStaff(silent=false){if(S.pending)return;busy(true);try{await loadStaff();render();}catch(e){S.error=e.message;render();if(silent)toast('Refresh failed. Displayed data may be older.');}finally{busy(false);}}
async function trackCustomer(data,silent=false){if(S.pending)return;busy(true);try{const result=await rpc('track',data);S.credentials=data;S.customerResult=result;S.today=result.today;S.fetchedAt=result.fetchedAt;S.error='';render();if(!silent)document.getElementById('customerResult').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){if(silent){toast('Refresh failed. Displayed data may be older.');}else{S.customerResult=null;document.getElementById('customerResult').innerHTML='<div class="panel panel-pad"><div class="error" role="alert">'+esc(e.message)+'</div></div>';}}finally{busy(false);}}
function formError(id,message){const e=document.getElementById(id);if(e)e.innerHTML='<div class="error">'+esc(message)+'</div>';else toast(message);}
document.addEventListener('submit',async e=>{const f=e.target;if(!['trackForm','loginForm'].includes(f.id))return;e.preventDefault();if(S.pending)return;const data=Object.fromEntries(new FormData(f));if(f.id==='trackForm'){await trackCustomer(data);return;}busy(true);try{const result=await rpc('login',{...data,page:PAGE});S.token=result.token;S.user=result.user;saveSession();await loadStaff();render();}catch(err){formError('loginError',err.message);}finally{busy(false);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;S.page=1;document.getElementById('bookingList').innerHTML=bookingList();}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){S[e.target.dataset.filter]=e.target.value;S.page=1;render();}if(e.target.id==='autoRefresh')S.auto=e.target.checked;});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='closeModal'){closeModal();return;}if(S.pending)return;
  if(action==='sampleOrder'||action==='sampleRepair'){document.getElementById('orderNumber').value=action==='sampleOrder'?'ORD-84':'REP-1261';document.getElementById('customerMobile').value='9876543210';document.getElementById('trackForm').requestSubmit();}
  if(action==='refreshCustomer'&&S.credentials)await trackCustomer(S.credentials,true);
  if(action==='refresh')await refreshStaff();
  if(action==='detail')await openDetail(b.dataset.id);
  if(action==='bucket'){S.bucket=S.bucket===b.dataset.bucket?'all':b.dataset.bucket;S.page=1;render();}
  if(action==='type'){S.type=b.dataset.type;S.page=1;render();}
  if(action==='allJobs'){S.bucket='all';S.type='all';S.page=1;render();}
  if(action==='issues'){S.bucket='issues';S.type='all';S.page=1;render();}
  if(action==='prev'||action==='next'){S.page+=action==='prev'?-1:1;document.getElementById('bookingList').innerHTML=bookingList();}
  if(action==='logout'){try{await rpc('logout');}catch(err){}clearSession();closeModal();render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const focus=[...document.querySelectorAll('.modal button,.modal a,.modal input')].filter(el=>!el.disabled&&el.offsetParent!==null);if(focus.length&&e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus.at(-1).focus();}else if(focus.length&&!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus();}}});
setInterval(()=>{if(!S.auto||S.pending||document.hidden||document.querySelector('.modal'))return;if(PAGE==='customer'&&S.credentials)trackCustomer(S.credentials,true);else if(S.user)refreshStaff(true);},60000);

function sampleDate(offset){const d=new Date();d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);}
function demoGroups(items){const map=new Map();items.forEach(j=>{const key=[j.branch,j.segment,j.type,j.number,j.contact,j.booked].join('|');if(!map.has(key))map.set(key,[]);map.get(key).push(j);});return [...map.values()].map(items=>{const j=items[0],flow=FLOW[j.type],status=items.some(i=>!i.status)?'':items.map(i=>i.status).sort((a,b)=>flow.indexOf(a)-flow.indexOf(b))[0];return {...j,id:'group-'+j.id,items:items.map(j=>({...j,statusLabel:LABELS[j.status]||'Status verification pending'})),itemCount:items.length,readyCount:items.filter(i=>['ready','delivered'].includes(i.status)).length,deliveredCount:items.filter(i=>i.status==='delivered').length,salespersons:unique(items.map(i=>i.salesperson)),rawStatuses:unique(items.map(i=>i.rawStatus)),status,statusLabel:LABELS[status]||'Status verification pending',issues:unique(items.flatMap(i=>i.issues))};});}
function demoPeople(){const seen=new Set();return DEMO_ITEMS.filter(j=>{const key=j.salesperson+'|'+j.branch;if(seen.has(key))return false;seen.add(key);return true;}).map(j=>({id:'demo-'+j.salesperson+'-'+j.branch,name:j.salesperson,branch:j.branch})).sort((a,b)=>a.name.localeCompare(b.name));}
function demoApi(action,p){
 if(action==='photo')return {src:demoPhoto};
 if(action==='track'){let q=String(p.order||'').trim().toUpperCase(),phone=String(p.mobile||'').replace(/\D/g,'');if(phone.startsWith('91')&&phone.length===12)phone=phone.slice(2);if(!/^(ORD|REP)-[A-Z0-9]+$/.test(q))throw new Error('Enter the full booking number, for example ORD-84 or REP-1261.');const groups=demoGroups(DEMO_ITEMS.filter(j=>j.contact===phone&&j.reference===q));if(!groups.length)throw new Error('Try ORD-84 or REP-1261 with mobile 9876543210.');return {groups,today:localDay(),fetchedAt:new Date().toISOString()};}
 if(action==='people')return demoPeople();
 if(action==='login'){if(PAGE==='admin'){if(String(p.username||'').trim().toLowerCase()!=='admin')throw new Error('Invalid username.');return {token:'sample-only',user:{name:'Admin',username:'admin',role:'admin',branch:'',salespersonName:''}};}const person=demoPeople().find(person=>person.id===p.personId);if(!person)throw new Error('Select your name.');return {token:'sample-only',user:{name:person.name,role:'salesperson',branch:person.branch,salespersonName:person.name}};}
 if(action==='logout')return true;
 if(!S.user)throw new Error('Please sign in.');
 const items=DEMO_ITEMS.filter(j=>S.user.role==='admin'||j.salesperson===S.user.salespersonName&&j.branch===S.user.branch),groups=demoGroups(items);
 if(action==='list')return {user:S.user,groups,today:localDay(),fetchedAt:new Date().toISOString(),links:{customer:'Customer.html',salesperson:'Salesperson.html',admin:'Admin.html'}};
 if(action==='detail'){const group=groups.find(g=>g.id===p.id);if(!group)throw new Error('Booking not found.');return group;}
 throw new Error('This tracker is view only.');
}
