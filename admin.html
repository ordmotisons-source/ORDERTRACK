function icon(name){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(PATHS[name]||PATHS.box)+'"/></svg>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmt(v){if(!v)return 'Not provided';const d=new Date(v.slice(0,10)+'T00:00:00');return isNaN(d)?v:new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(d);}
function stamp(v){if(!v)return '';return new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',second:'2-digit',timeZone:'Asia/Kolkata'}).format(new Date(v));}
function pill(label,tone='gold'){return '<span class="pill '+tone+'">'+esc(label)+'</span>';}
function initials(n){return String(n||'M').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function delivery(g){if(g.status==='cancel')return {label:'Cancel',tone:'grey'};if(g.status==='hold')return {label:'Hold',tone:'gold'};if(g.status==='delivered')return {label:'Delivered',tone:'grey'};if(g.status==='ready')return {label:'Ready for Pickup',tone:'green'};if(g.due&&g.due<S.today)return {label:'Overdue',tone:'red'};if(g.due===S.today)return {label:'Due Today',tone:'gold'};if(!g.due)return {label:'Date Missing',tone:'gold'};return {label:'On Track',tone:'green'};}
function overdue(g){return !['ready','delivered','cancel'].includes(g.status)&&g.due&&g.due<S.today;}
function logoMark(size='medium',animated=false){return '<span class="logo-mark logo-'+size+(animated?' is-loading':'')+'"><span class="logo-disc"><img src="'+LOGO_SRC+'" alt="Motisons Logo" width="108" height="135"></span></span>';}
function headerGlow(){document.querySelector('#headerLogo .logo-mark')?.classList.toggle('is-loading',S.pending||S.background||PHOTO_ACTIVE>0||LOCAL_SEARCH_ACTIVE);}
function busy(on,label='Loading…'){S.pending=on;document.getElementById('pending').hidden=!on;document.getElementById('logoLoading').hidden=!on;document.getElementById('loadingCaption').textContent=label;document.getElementById('app').setAttribute('aria-busy',String(on));document.querySelectorAll('button[type="submit"]').forEach(b=>b.disabled=on);headerGlow();}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3800);}
function tokenKey(){return 'motisons-v3-'+PAGE;}
function saveSession(){try{sessionStorage.setItem(tokenKey(),S.token);}catch(e){}}
function clearSession(){DETAIL_CACHE.clear();DETAIL_REQUESTS.clear();PHOTO_CACHE.clear();PHOTO_REQUESTS.clear();closePhoto(false);S.token='';S.user=null;try{sessionStorage.removeItem(tokenKey());}catch(e){}}
function rpc(action,data={}){
 if(PREVIEW)return Promise.resolve().then(()=>demoApi(action,data));
 const payload={...data,action,token:S.token};
 const unwrap=r=>{if(r?.ok)return r.data;const m=r?.error||'Request failed.';if(m.includes('Session expired'))clearSession();throw new Error(m);};
 if(APPS_RUNTIME)return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>{try{resolve(unwrap(r));}catch(e){reject(e);}}).withFailureHandler(()=>reject(new Error('Connection failed.'))).trackerApi(payload);});
 return (async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{
   const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',credentials:'omit',signal:controller.signal});
   let result;try{result=JSON.parse(await response.text());}catch(e){throw new Error('Backend unavailable.');}
   return unwrap(result);
 }catch(e){if(e.name==='TypeError'||e.name==='AbortError')throw new Error('Connection failed.');throw e;}finally{clearTimeout(timer);}})();

function detailRequest(id,reference){

function loadPhotos(){

 const enqueue=box=>{if(!box.isConnected||box.dataset.photoLoading==='queued')return;box.dataset.photoLoading='queued';PHOTO_QUEUE.push(box);pumpPhotos();};
 if('IntersectionObserver' in window){PHOTO_OBSERVER=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){PHOTO_OBSERVER.unobserve(entry.target);enqueue(entry.target);}}),{rootMargin:'200px'});nodes.forEach(box=>{box.dataset.photoLoading='observed';PHOTO_OBSERVER.observe(box);});}

async function photoSource(grant,key,original=false){
 const cacheKey=(original?'full:':'preview:')+key,cached=PHOTO_CACHE.get(cacheKey);if(cached&&Date.now()-cached.at<300000)return cached.src;
 let pending=PHOTO_REQUESTS.get(cacheKey);if(!pending){pending=rpc('photo',{grant,original}).finally(()=>PHOTO_REQUESTS.delete(cacheKey));PHOTO_REQUESTS.set(cacheKey,pending);}
 const result=await pending,src=result.src;
 if(!/^data:image\/(?:jpeg|png|webp|gif);base64,|^https:\/\//i.test(src)&&!(!LIVE&&src.startsWith('data:image/svg+xml;base64,')))throw new Error('Unsupported image.');
 PHOTO_CACHE.set(cacheKey,{src,at:Date.now()});if(PHOTO_CACHE.size>100)PHOTO_CACHE.delete(PHOTO_CACHE.keys().next().value);return src;
}

}

async function openPhoto(grant,key,title,preview){
 PHOTO_FOCUS=document.activeElement;const epoch=++PHOTO_SERIAL,root=document.getElementById('photoRoot');

 if(initial)body.replaceChildren(photoElement(initial,title));else body.innerHTML='<div class="photo-enlarged-loading">'+logoMark('large',true)+'</div>';

async function trackCustomer(data,silent=false,fresh=false){if(S.pending||(silent&&S.background))return;const serial=++DATA_SERIAL;if(silent){S.background=true;headerGlow();}else busy(true,'Searching…');try{const result=await rpc('track',{...data,fresh});if(serial!==DATA_SERIAL)return;S.credentials=data;S.customerResult=result;S.today=result.today;S.fetchedAt=result.fetchedAt;S.error='';render();if(!silent)document.getElementById('customerResult').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){if(serial!==DATA_SERIAL)return;if(silent)toast('Refresh failed.');else{S.customerResult=null;document.getElementById('customerResult').innerHTML='<div class="panel panel-pad"><div class="error" role="alert">'+esc(e.message)+'</div></div>';}}finally{if(silent){S.background=false;headerGlow();}else busy(false);}}
function formError(id,message){const e=document.getElementById(id);if(e)e.innerHTML='<div class="error">'+esc(message)+'</div>';else toast(message);}
document.addEventListener('submit',async e=>{const f=e.target;if(!['trackForm','loginForm'].includes(f.id))return;e.preventDefault();if(S.pending)return;const data=Object.fromEntries(new FormData(f));if(f.id==='trackForm'){await trackCustomer(data);return;}busy(true);try{const result=await rpc('login',{...data,page:PAGE});S.token=result.token;S.user=result.user;saveSession();if(result.dashboard)applyStaff(result.dashboard);else await loadStaff();render();}catch(err){formError('loginError',err.message);}finally{busy(false);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;S.page=1;LOCAL_SEARCH_ACTIVE=true;headerGlow();requestAnimationFrame(()=>{const list=document.getElementById('bookingList');if(list)list.innerHTML=bookingList();LOCAL_SEARCH_ACTIVE=false;headerGlow();});}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){S[e.target.dataset.filter]=e.target.value;S.page=1;render();}if(e.target.id==='autoRefresh')S.auto=e.target.checked;});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='closePhoto'){closePhoto();return;}if(action==='closeModal'){closeModal();return;}if(S.pending)return;
  if(action==='sampleOrder'||action==='sampleRepair'){document.getElementById('orderNumber').value=action==='sampleOrder'?'ORD-84':'REP-1261';document.getElementById('customerMobile').value='9876543210';document.getElementById('trackForm').requestSubmit();}
  if(action==='refreshCustomer'&&S.credentials)await trackCustomer(S.credentials,false,true);
  if(action==='refresh')await refreshStaff();
  if(action==='detail')await openDetail(b.dataset.id);
  if(action==='bucket'){S.bucket=S.bucket===b.dataset.bucket?'all':b.dataset.bucket;S.page=1;render();}
  if(action==='type'){S.type=b.dataset.type;S.page=1;render();}
  if(action==='allJobs'){S.bucket='all';S.type='all';S.page=1;render();}
  if(action==='issues'){S.bucket='issues';S.type='all';S.page=1;render();}
  if(action==='prev'||action==='next'){S.page+=action==='prev'?-1:1;document.getElementById('bookingList').innerHTML=bookingList();}
  if(action==='logout'){try{await rpc('logout');}catch(err){}clearSession();closeModal();render();}
});
document.addEventListener('keydown',e=>{if(document.querySelector('.photo-dialog')){if(e.key==='Escape'){closePhoto();e.preventDefault();}if(e.key==='Tab'){e.preventDefault();document.querySelector('.photo-close').focus();}return;}if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const focus=[...document.querySelectorAll('.modal button,.modal a,.modal input')].filter(el=>!el.disabled&&el.offsetParent!==null);if(focus.length&&e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus.at(-1).focus();}else if(focus.length&&!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus();}}});
setInterval(()=>{if(!S.auto||S.pending||S.background||document.hidden||document.querySelector('.modal,.photo-dialog')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;if(PAGE==='customer'&&S.credentials)trackCustomer(S.credentials,true);else if(S.user)refreshStaff(true);},60000);

function sampleDate(offset){const d=new Date();d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);}
function demoGroups(items){const map=new Map();items.forEach(j=>{const key=[j.branch,j.segment,j.type,j.number,j.contact,j.booked].join('|');if(!map.has(key))map.set(key,[]);map.get(key).push(j);});return [...map.values()].map(items=>{const j=items[0],flow=FLOW[j.type],live=items.filter(i=>i.status!=='cancel'),status=!live.length?'cancel':live.some(i=>!i.status)?'':live.some(i=>i.status==='hold')?'hold':live.map(i=>i.status).sort((a,b)=>flow.indexOf(a)-flow.indexOf(b))[0];return {...j,id:'group-'+j.id,items:items.map(j=>({...j,statusLabel:LABELS[j.status]||'Status verification pending'})),itemCount:items.length,readyCount:items.filter(i=>['ready','delivered'].includes(i.status)).length,deliveredCount:items.filter(i=>i.status==='delivered').length,salespersons:unique(items.map(i=>i.salesperson)),rawStatuses:unique(items.map(i=>i.rawStatus)),status,statusLabel:LABELS[status]||'Status verification pending',issues:unique(items.flatMap(i=>i.issues))};});}
function demoPeople(){const seen=new Set();return DEMO_ITEMS.filter(j=>{const key=j.salesperson+'|'+j.branch;if(seen.has(key))return false;seen.add(key);return true;}).map(j=>({id:'demo-'+j.salesperson+'-'+j.branch,name:j.salesperson,branch:j.branch})).sort((a,b)=>a.name.localeCompare(b.name));}
function demoApi(action,p){
 if(action==='photo')return {src:demoPhoto};
 if(action==='track'){let q=String(p.order||'').trim().toUpperCase(),phone=String(p.mobile||'').replace(/\D/g,'');if(phone.startsWith('91')&&phone.length===12)phone=phone.slice(2);if(!/^(ORD|REP)-[A-Z0-9]+$/.test(q))throw new Error('Enter the full booking number, for example ORD-84 or REP-1261.');const groups=demoGroups(DEMO_ITEMS.filter(j=>j.contact===phone&&j.reference===q));if(!groups.length)throw new Error('Try ORD-84 or REP-1261 with mobile 9876543210.');return {groups,today:localDay(),fetchedAt:new Date().toISOString()};}
 if(action==='people')return demoPeople();
 if(action==='login'){if(PAGE==='admin'){if(String(p.username||'').trim().toLowerCase()!=='admin')throw new Error('Invalid username.');return {token:'sample-only',user:{name:'Admin',username:'admin',role:'admin',branch:'',salespersonName:''}};}const person=demoPeople().find(person=>person.id===p.personId);if(!person)throw new Error('Select your name.');return {token:'sample-only',user:{name:person.name,role:'salesperson',branch:person.branch,salespersonName:person.name}};}
 if(action==='logout')return true;
 if(!S.user)throw new Error('Please sign in.');
 const items=DEMO_ITEMS.filter(j=>S.user.role==='admin'||j.salesperson===S.user.salespersonName&&j.branch===S.user.branch),groups=demoGroups(items);
 if(action==='list')return {user:S.user,groups,today:localDay(),fetchedAt:new Date().toISOString(),links:{customer:'Customer.html',salesperson:'Salesperson.html',admin:'Admin.html'}};
 if(action==='detail'){const group=groups.find(g=>g.id===p.id);if(!group)throw new Error('Booking not found.');return group;}
 throw new Error('This tracker is view only.');
}
